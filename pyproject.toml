[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-skills"
version = "0.1.0"
description = "Chat runtime with dynamic skill injection using AgentScope"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentscope>=0.1.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
chat-skills = "chat_skills.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chat_skills*"]
