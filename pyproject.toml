[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-chat"
version = "0.1.0"
description = "Skill-aware Chat Runtime based on AgentScope"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentscope>=0.1.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
chat-with-skills = "skill_chat.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_chat*"]
